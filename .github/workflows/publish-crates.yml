# Custom dist publish job: push the workspace crates to crates.io.
#
# Wired in via `publish-jobs = ["./publish-crates"]` in Cargo.toml's
# `[workspace.metadata.dist]`; dist calls this reusable workflow in the publish
# stage (after the GitHub Release is created) with `secrets: inherit`, so
# `CARGO_REGISTRY_TOKEN` (a repo secret) is available here.
#
# crates.io has no atomic multi-crate publish, so the members go up in dependency
# order — oci-arm-catcher-core first, then the binary that depends on it — with
# `cargo publish` waiting for each to appear in the index before returning.
name: Publish to crates.io

on:
  workflow_call:
    # dist passes the plan; we don't read it, but the input must be declared.
    inputs:
      plan:
        required: true
        type: string
  # Allow a manual re-run from the Actions tab if a publish half-fails.
  workflow_dispatch:

jobs:
  publish-crates:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Publish oci-arm-catcher-core
        run: cargo publish -p oci-arm-catcher-core
      - name: Publish oci-arm-catcher
        run: cargo publish -p oci-arm-catcher
